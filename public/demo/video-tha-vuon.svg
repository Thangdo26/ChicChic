  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-60,0; 350,0" dur="7.4s" begin="-2.2s" repeatCount="indefinite"/>
    <g transform="translate(0,146) scale(.86)"><use href="#v2hen"/></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-40,0; 350,0" dur="8.6s" begin="-4.6s" repeatCount="indefinite"/>
