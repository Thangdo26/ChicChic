<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="v2sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6E9F5"/><stop offset="1" stop-color="#EAF2E2"/></linearGradient>
    <g id="v2hen">
      <ellipse rx="12" ry="9.6" fill="#E9C46A"/>
      <circle cx="9" cy="-6.8" r="6.5" fill="#E9C46A"/>
      <circle cx="10.8" cy="-8" r="1.2" fill="#22302A"/>
      <path d="M14.4 -6.8 l5 1.8 l-5 1.8z" fill="#E7883C"/>
      <path d="M8 -13.6 q1.4 -3.8 3.8 -1.4" stroke="#C0801F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g stroke="#C0801F" stroke-width="1.7" stroke-linecap="round">
        <path d="M-4 9 l-2 7"><animate attributeName="d" values="M-4 9 l-2 7; M-4 9 l4 6; M-4 9 l-2 7" dur=".34s" repeatCount="indefinite"/></path>
        <path d="M3 9 l4 6"><animate attributeName="d" values="M3 9 l4 6; M3 9 l-2 7; M3 9 l4 6" dur=".34s" repeatCount="indefinite"/></path>
      </g>
    </g>
  </defs>

  <rect width="320" height="180" fill="url(#v2sky)"/>
  <g fill="#FFFFFF" opacity=".8">
    <ellipse cx="70" cy="32" rx="26" ry="11"><animate attributeName="cx" values="70;96;70" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="242" cy="24" rx="20" ry="9"><animate attributeName="cx" values="242;218;242" dur="17s" repeatCount="indefinite"/></ellipse>
  </g>
  <path d="M0 96 q60 -18 120 -6 q70 14 200 -8 v98 H0z" fill="#A7C795"/>
  <path d="M0 118 q80 -12 160 4 q80 14 160 -8 v66 H0z" fill="#8CB878"/>

  <g transform="translate(28,64)" opacity=".95">
    <rect x="0" y="24" width="56" height="36" rx="4" fill="#EFE2C6" stroke="#C9A26B" stroke-width="1.6"/>
    <path d="M-6 26 L28 6 L62 26 Z" fill="#8C5A3B"/>
    <rect x="20" y="42" width="16" height="18" rx="2" fill="#6f472d"/>
  </g>

  <!-- cỏ đung đưa -->
  <g stroke="#6E9E5C" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M24 158 q2 -8 0 -14"><animate attributeName="d" values="M24 158 q2 -8 0 -14; M24 158 q-3 -8 1 -14; M24 158 q2 -8 0 -14" dur="3s" repeatCount="indefinite"/></path>
