<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="v1sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEBC9"/><stop offset="1" stop-color="#E8F1E0"/></linearGradient>
    <g id="v1hen">
      <ellipse rx="13" ry="10.5" fill="#E9C46A"/>
      <circle cx="9.6" cy="-7.4" r="7" fill="#E9C46A"/>
      <circle cx="11.6" cy="-8.6" r="1.3" fill="#22302A"/>
      <path d="M15.4 -7.4 l5.2 1.9 l-5.2 1.9z" fill="#E7883C"/>
      <path d="M8.6 -14.6 q1.5 -4 4 -1.5" stroke="#C0801F" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <path d="M-12 3.2 l-5.4 4.4 M-12 5.8 l-5.4 1.5" stroke="#C0801F" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="320" height="180" fill="url(#v1sky)"/>
  <circle cx="272" cy="34" r="18" fill="#F7D585" opacity=".85"/>
  <path d="M0 122 q80 -14 160 -2 q80 12 160 -4 v64 H0z" fill="#CFE0BE"/>
  <path d="M0 142 q90 -10 170 2 q75 11 150 -6 v42 H0z" fill="#B6D0A2"/>

  <g transform="translate(196,52)" opacity=".95">
    <rect x="0" y="26" width="70" height="48" rx="4" fill="#EFE2C6" stroke="#C9A26B" stroke-width="1.8"/>
    <path d="M-7 28 L35 6 L77 28 Z" fill="#8C5A3B"/>
    <rect x="24" y="48" width="20" height="26" rx="3" fill="#6f472d"/>
  </g>

  <!-- tay cô Lan rắc thóc -->
  <g transform="translate(60,44)">
    <animateTransform attributeName="transform" type="translate" values="60,44; 74,40; 60,44" dur="2.4s" repeatCount="indefinite"/>
    <path d="M-14 0 q10 -12 24 -4 q6 4 2 10 q-12 8 -26 -6z" fill="#F0C89A" stroke="#D9A87A" stroke-width="1.2"/>
    <path d="M-16 2 q-8 4 -10 12" stroke="#2F5D3A" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- thóc rơi -->
  <g fill="#E3C97E">
    <circle cx="82" cy="60" r="2.2"><animate attributeName="cy" values="60;134" dur="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="94" cy="60" r="2" ><animate attributeName="cy" values="60;138" dur="1.3s" begin="-.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.3s" begin="-.4s" repeatCount="indefinite"/></circle>
    <circle cx="106" cy="60" r="2.4"><animate attributeName="cy" values="60;132" dur="1.0s" begin="-.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.0s" begin="-.7s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="60" r="2"  ><animate attributeName="cy" values="60;136" dur="1.25s" begin="-.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.25s" begin="-.2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="60" r="2.3"><animate attributeName="cy" values="60;140" dur="1.15s" begin="-.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.15s" begin="-.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- đàn gà mổ thóc -->
  <g transform="translate(92,140)">
    <animateTransform attributeName="transform" type="rotate" values="0;16;0" dur="0.9s" repeatCount="indefinite"/>
    <use href="#v1hen"/>
  </g>
  <g transform="translate(132,146)">
    <animateTransform attributeName="transform" type="rotate" values="0;-14;0" dur="1.1s" begin="-.3s" repeatCount="indefinite"/>
    <use href="#v1hen" transform="scale(.92)"/>
  </g>
  <g transform="translate(170,138)">
    <animateTransform attributeName="transform" type="rotate" values="0;18;0" dur="1.05s" begin="-.6s" repeatCount="indefinite"/>
    <use href="#v1hen" transform="scale(.84)"/>
  </g>

  <rect x="0" y="158" width="320" height="22" fill="#22302A" opacity=".55"/>
  <text x="12" y="173" font-size="11" fill="#F7F3E4" font-family="system-ui,sans-serif">Cữ ăn sáng của đàn</text>
</svg>
