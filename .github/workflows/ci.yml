name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres riêng: chạy SQL migration và test race, gồm cả CHECK ngoài Prisma.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: chic
          POSTGRES_DB: cc_b01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:chic@localhost:5432/cc_b01_test?schema=public
      DIRECT_URL: postgresql://postgres:chic@localhost:5432/cc_b01_test?schema=public
      CC_B01_DATABASE_URL: postgresql://postgres:chic@localhost:5432/cc_b01_test
      NEXT_PUBLIC_HOLD_BANK: "Demo Bank · 000 · CI"
      NEXT_PUBLIC_HOLD_MOMO: "0900000000"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fixture migration cần schema của commit audit.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (postinstall chạy prisma generate)
        run: npm ci

      - name: Dựng baseline rồi áp SQL CC-B01
        run: |
          git show 60f7b87ed03a2e3534bca47255cb247368a810d7:prisma/schema.prisma > "$RUNNER_TEMP/cc-b01-before.prisma"
          npx prisma migrate diff --from-empty --to-schema-datamodel "$RUNNER_TEMP/cc-b01-before.prisma" --script --output "$RUNNER_TEMP/cc-b01-before.sql"
          npx prisma db execute --file "$RUNNER_TEMP/cc-b01-before.sql" --schema prisma/schema.prisma
          npx prisma db execute --file prisma/migrations/202609070001_cc_b01/migration.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/migrations/202609080001_session_scope/migration.sql --schema prisma/schema.prisma

      - name: Type-check
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Bộ kiểm bất biến §9. KHÔNG nối DB, không dựng máy chủ - chạy ~1 giây, nên nó
      # đứng TRƯỚC build: hỏng ở đây thì biết ngay, khỏi chờ hết một lượt build.
      - name: Test
        run: npm test

      - name: Test PostgreSQL lifecycle và gate deploy
        run: npm run test:lifecycle:pg

      - name: Test quyền phiên và idempotency với PostgreSQL
        run: npm run test:security:pg

      - name: Kiểm tra dependency
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build:vercel

      - name: Smoke HTTP production (quyền phiên, CSRF, cookie rotation)
        env:
          CC_SECURITY_SMOKE_DATABASE_URL: postgresql://postgres:chic@localhost:5432/cc_b01_test?schema=public
        run: npm run test:security:http
